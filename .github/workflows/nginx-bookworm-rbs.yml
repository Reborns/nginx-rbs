name: Build Nginx Bookworm
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:bookworm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Debian Build Stack
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y curl gnupg2 ca-certificates lsb-release debian-archive-keyring
          curl https://nginx.org/keys/nginx_signing.key | gpg --dearmor \
          | tee /usr/share/keyrings/nginx-archive-keyring.gpg >/dev/null
          cat <<EOF > /etc/apt/sources.list.d/nginx.list
          deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/mainline/debian bookworm nginx
          deb-src [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/mainline/debian bookworm nginx
          EOF
          pt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y dpkg-dev devscripts debhelper fakeroot ruby ruby-dev \
          build-essential libcurl4-openssl-dev libssl-dev zlib1g-dev git wget

      - name: Clone Fresh Modules
        run: |
          mkdir -p /opt/nginx-modules
          git clone --single-branch --depth 1 https://github.com/nginx/njs.git /opt/nginx-modules/njs

      - name: Build Passenger Module (Parallel)
        run: |
          gem install passenger 
          PASSENGER_ROOT=$(gem env gemdir)/gems/$(gem list passenger | grep passenger | head -n 1 | awk '{print $1 "-" $2}' | tr -d '()')
          PASSENGER_SRC="$PASSENGER_ROOT/src/nginx_module"
          cd "$PASSENGER_SRC" && rake nginx:as_dynamic_module CACHING=false -j$(nproc)
          echo "PASSENGER_PATH=$PASSENGER_SRC" >> $GITHUB_ENV

      - name: Fetch Nginx Source and Update Changelog
        run: |
          apt-get build-dep -y nginx
          apt-get source nginx
          cd nginx-*/
          export DEBFULLNAME="Nginx Packaging"
          export DEBEMAIL="nginx-packaging@f5.com"
          ORIG_VERSION=$(dpkg-parsechangelog -S Version)
          NEW_VERSION="${ORIG_VERSION}~rbs~bookworm"
          dch --newversion "$NEW_VERSION" --distribution "bookworm" --force-distribution --force-bad-version "Build for version $ORIG_VERSION by RBS."
          cp ../rules-rbs debian/rules
          chmod +x debian/rules

      - name: Run dpkg-buildpackage
        run: |
          cd nginx-*/
          dpkg-buildpackage -rfakeroot -uc -b -j$(nproc)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "bookworm-${{ github.run_id }}"
          files: ./*.deb
          name: "Nginx Bookworm Build"
