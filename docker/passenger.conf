# Passenger example configuration for nginx-rbs.
#
# The Passenger module is built into this image but NOT loaded by default:
# loading it starts the Passenger watchdog and agent processes in every
# container, which is unwanted overhead if you are not serving a Ruby/Node/Python
# app. Enable it with:
#
#   ln -sf /etc/nginx/modules-available/50-http-passenger.conf \
#          /etc/nginx/modules-enabled/50-http-passenger.conf
#
# ...or in your own Dockerfile:
#
#   FROM reborns/nginx-rbs:trixie
#   RUN ln -sf /etc/nginx/modules-available/50-http-passenger.conf \
#              /etc/nginx/modules-enabled/50-http-passenger.conf
#   COPY my-passenger.conf /etc/nginx/conf.d/passenger.conf
#
# Then copy this file to /etc/nginx/conf.d/passenger.conf and uncomment.
# The paths below were substituted at image build time and are correct for this
# image; `passenger-config --root` will confirm them.

# passenger_root @PASSENGER_ROOT@;
# passenger_ruby @PASSENGER_RUBY@;

# passenger_instance_registry_dir /tmp;
# passenger_max_pool_size 5;
# passenger_min_instances 1;

# server {
#     listen 80;
#     server_name app.example.com;
#     root /srv/app/public;
#
#     passenger_enabled on;
#     passenger_app_env production;
# }
