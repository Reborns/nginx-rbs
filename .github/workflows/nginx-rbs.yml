name: Manual Build Custom Nginx
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        debian_version: [bookworm, trixie]
    
    runs-on: ubuntu-latest
    container: debian:${{ matrix.debian_version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Debian Build Stack
        run: |
          apt-get update
          apt-get install -y dpkg-dev devscripts debhelper fakeroot ruby ruby-dev \
          build-essential libcurl4-openssl-dev libssl-dev zlib1g-dev git wget
          echo "deb-src http://deb.debian.org/debian ${{ matrix.debian_version }} main" >> /etc/apt/sources.list
          apt-get update

      - name: Clone Fresh Modules from GitHub
        run: |
          mkdir -p /opt/nginx-modules
          git clone --single-branch --depth 1 https://github.com/nginx/njs.git

      - name: Build Latest Passenger Dynamic Module
        run: |
          gem install passenger 
          # Extract path for latest passenger gem
          PASSENGER_ROOT=$(gem env gemdir)/gems/$(gem list passenger | grep passenger | awk '{print $1 "-" $2}' | tr -d '()')
          PASSENGER_SRC="$PASSENGER_ROOT/src/nginx_module"
          
          cd $PASSENGER_SRC && rake nginx:as_dynamic_module CACHING=false
          echo "PASSENGER_PATH=$PASSENGER_SRC" >> $GITHUB_ENV

      - name: Fetch Latest Nginx Source and Update Changelog
        run: |
          apt-get build-dep -y nginx
          apt-get source nginx
          cd nginx-*/
          
          ORIG_VERSION=$(dpkg-parsechangelog -S Version)
          NEW_VERSION="${ORIG_VERSION}+rbs~${{ matrix.debian_version }}"
          
          export DEBFULLNAME="Nginx Packaging"
          export DEBEMAIL="nginx-packaging@f5.com"
          
          dch --newversion "$NEW_VERSION" \
              --distribution "${{ matrix.debian_version }}" \
              --force-distribution \
              --force-bad-version \
              "Custom NginX build by RBS."

          # Ensure your 'my-custom-rules' file exists in your repo root
          cp ../rules-rbs debian/rules
          chmod +x debian/rules

      - name: Run dpkg-buildpackage
        run: |
          cd nginx-*/
          dpkg-buildpackage -rfakeroot -uc -b

      - name: Upload .deb Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nginx-custom-${{ matrix.debian_version }}
          path: ./*.deb

      - name: Push to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "manual-build-${{ matrix.debian_version }}"
          files: ./*.deb
          name: "Manual Nginx Build (${{ matrix.debian_version }})"
          body: "Custom Nginx build for ${{ matrix.debian_version }}. Compiled on $(date)."
