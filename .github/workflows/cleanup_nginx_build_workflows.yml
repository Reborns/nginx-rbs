name: Cleanup Nginx Workflow Runs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v8
        with:
          script: |
            const KEEP = 3;
            const KEEP_SELF = 1;
            const FILTER = 'nginx';

            const { owner, repo } = context.repo;
            const currentRunId = context.runId;

            // Reliably get this workflow's ID
            const currentRun = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: currentRunId,
            });
            const selfWorkflowId = currentRun.data.workflow_id;

            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo });

            for (const workflow of workflows.data.workflows) {
              const isSelf = workflow.id === selfWorkflowId;
              const isNginx = workflow.name.toLowerCase().includes(FILTER.toLowerCase());

              if (!isNginx && !isSelf) continue;

              const keep = isSelf ? KEEP_SELF : KEEP;
              console.log(`Processing: "${workflow.name}" (keep=${keep}${isSelf ? ', self' : ''})`);

              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflow.id,
                per_page: 100,
              });

              // All runs sorted newest first (default)
              const allRuns = runs.data.workflow_runs;

              // Runs to delete = everything after KEEP, but skip current run (can't delete in-progress)
              const toDelete = allRuns
                .slice(keep)
                .filter(r => r.id !== currentRunId);  // exclude current from DELETION only

              console.log(`  → Total: ${allRuns.length}, keeping ${keep}, deleting ${toDelete.length}`);

              for (const run of toDelete) {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                console.log(`  → Deleted run ${run.id}`);
              }
            }
