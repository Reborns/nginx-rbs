# Default server. Kept free of any dynamic-module directives on purpose: if you
# disable a module by removing its symlink from /etc/nginx/modules-enabled, this
# file must still be valid. Module-specific examples live alongside it as
# *.conf.example (VTS, GeoIP2, auth-JWT, Passenger).

server {
    listen       80;
    listen       [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # stub_status is a built-in module in this build, so it is always safe here.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
