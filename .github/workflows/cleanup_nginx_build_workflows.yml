name: Cleanup Nginx Workflow Runs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 3;
            const KEEP_SELF = 1;       // how many runs of THIS workflow to keep
            const FILTER = 'nginx';    // filter for target workflows

            const { owner, repo } = context.repo;
            const currentWorkflowId = context.workflow;  // this workflow's name
            const currentRunId = context.runId;          // this exact run's ID

            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo });

            for (const workflow of workflows.data.workflows) {
              const isSelf = workflow.name === currentWorkflowId;
              const isNginx = workflow.name.toLowerCase().includes(FILTER.toLowerCase());

              // Skip workflows that don't match nginx AND aren't self
              if (!isNginx && !isSelf) continue;

              const keep = isSelf ? KEEP_SELF : KEEP;
              console.log(`Processing: "${workflow.name}" (keep=${keep}${isSelf ? ', self' : ''})`);

              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflow.id,
                per_page: 100,
              });

              // For self: skip the current running instance so it doesn't delete itself mid-run
              const runsToConsider = isSelf
                ? runs.data.workflow_runs.filter(r => r.id !== currentRunId)
                : runs.data.workflow_runs;

              const toDelete = runsToConsider.slice(keep);
              console.log(`  → Keeping ${keep}, deleting ${toDelete.length}`);

              for (const run of toDelete) {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                console.log(`  → Deleted run ${run.id}`);
              }
            }
