name: Cleanup Nginx Workflow Runs

on:
  schedule:
    - cron: '13 0 * * *'  # 00:13 UTC, off the full hour
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v8
        with:
          script: |
            const KEEP = 3;        // newest runs kept per live workflow
            const KEEP_SELF = 1;   // newest runs kept for this cleanup workflow
            const FILTER = 'nginx';

            const { owner, repo } = context.repo;
            const currentRunId = context.runId;

            const currentRun = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: currentRunId,
            });
            const selfWorkflowId = currentRun.data.workflow_id;

            // Workflows that still have a file in the repo.
            const live = new Map();
            for (const wf of await github.paginate(
                   github.rest.actions.listRepoWorkflows, { owner, repo, per_page: 100 })) {
              live.set(wf.id, wf);
            }

            // Runs are listed repo-wide rather than per workflow_id on purpose.
            // listWorkflowRuns({workflow_id}) resolves through the workflow FILE
            // and 404s once that file is deleted, while listRepoWorkflows keeps
            // returning the workflow with state 'deleted'. That combination is
            // what broke this job when the bullseye workflow was removed: the
            // deleted workflow still matched the name filter, its run listing
            // 404'd, and the uncaught throw failed the whole run.
            const allRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 });

            const byWorkflow = new Map();
            for (const run of allRuns) {
              if (!byWorkflow.has(run.workflow_id)) byWorkflow.set(run.workflow_id, []);
              byWorkflow.get(run.workflow_id).push(run);
            }

            let deleted = 0, failed = 0;
            const report = [];

            for (const [workflowId, runs] of byWorkflow) {
              runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              const wf = live.get(workflowId);
              const orphaned = !wf;
              const isSelf = workflowId === selfWorkflowId;
              const name = wf ? wf.name : (runs[0].name || `workflow ${workflowId}`);

              if (!name.toLowerCase().includes(FILTER.toLowerCase()) && !isSelf) continue;

              // An orphaned workflow has no file any more, so none of its runs
              // can ever be re-run or compared against. Keep none of them.
              const keep = orphaned ? 0 : (isSelf ? KEEP_SELF : KEEP);
              const toDelete = runs.slice(keep).filter(r => r.id !== currentRunId);

              const label = `"${name}"${orphaned ? ' (orphaned)' : ''}${isSelf ? ' (self)' : ''}`;
              console.log(`Processing ${label}: ${runs.length} runs, keep ${keep}, delete ${toDelete.length}`);

              let wfDeleted = 0, wfFailed = 0;
              for (const run of toDelete) {
                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                  wfDeleted++; deleted++;
                } catch (e) {
                  // In-progress runs cannot be deleted; that is normal, not fatal.
                  wfFailed++; failed++;
                  core.warning(`could not delete run ${run.id} of ${label}: ${e.status ?? ''} ${e.message}`);
                }
              }
              report.push(`| ${name} | ${orphaned ? 'orphaned' : 'live'} | ${runs.length} | ${keep} | ${wfDeleted} | ${wfFailed} |`);
            }

            await core.summary
              .addHeading('Workflow run cleanup', 3)
              .addTable([
                [ {data: 'Workflow', header: true}, {data: 'State', header: true},
                  {data: 'Runs', header: true}, {data: 'Kept', header: true},
                  {data: 'Deleted', header: true}, {data: 'Failed', header: true} ],
              ])
              .addRaw(report.join('\n') + '\n')
              .addRaw(`\nTotal deleted: **${deleted}**, failed: **${failed}**\n`)
              .write();

            console.log(`Done. Deleted ${deleted}, failed ${failed}.`);
