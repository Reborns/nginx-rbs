name: Manual Build Custom Nginx
on:
  workflow_dispatch: # This enables the "Run workflow" button in GitHub Actions

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        debian_version: [bookworm, trixie]
    
    runs-on: ubuntu-latest
    container: debian:${{ matrix.debian_version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Debian Build Stack
        run: |
          apt-get update
          # Fix: Use correct /debian/ path for main and source repos
          echo "deb http://deb.debian.org ${{ matrix.debian_version }} main" > /etc/apt/sources.list
          echo "deb-src http://deb.debian.org ${{ matrix.debian_version }} main" >> /etc/apt/sources.list
          
          # Add Security repos (Crucial for latest patched versions)
          if [ "${{ matrix.debian_version }}" = "bookworm" ]; then
            echo "deb http://security.debian.org ${{ matrix.debian_version }}-security main" >> /etc/apt/sources.list
            echo "deb-src http://security.debian.org ${{ matrix.debian_version }}-security main" >> /etc/apt/sources.list
          fi

          apt-get update
          apt-get install -y dpkg-dev devscripts debhelper fakeroot ruby ruby-dev \
          build-essential libcurl4-openssl-dev libssl-dev zlib1g-dev git wget

      - name: Clone Fresh Modules from GitHub
        run: |
          mkdir -p /opt/nginx-modules
           git clone --single-branch --depth 1 https://github.com/nginx/njs.git

      - name: Build Passenger Dynamic Module (Parallel)
        run: |
          gem install passenger 
          # Auto-detect gem path
          PASSENGER_ROOT=$(gem env gemdir)/gems/$(gem list passenger | grep passenger | head -n 1 | awk '{print $1 "-" $2}' | tr -d '()')
          PASSENGER_SRC="$PASSENGER_ROOT/src/nginx_module"
          
          # Speed up with -j$(nproc) to use all available CPU cores
          cd "$PASSENGER_SRC" && rake nginx:as_dynamic_module CACHING=false -j$(nproc)
          
          echo "PASSENGER_PATH=$PASSENGER_SRC" >> $GITHUB_ENV

      - name: Fetch Latest Nginx Source and Update Changelog
        run: |
          apt-get build-dep -y nginx
          apt-get source nginx
          cd nginx-*/
          
          export DEBFULLNAME="Nginx Packaging"
          export DEBEMAIL="nginx-packaging@f5.com"
          
          ORIG_VERSION=$(dpkg-parsechangelog -S Version)
          NEW_VERSION="${ORIG_VERSION}~rbs~${{ matrix.debian_version }}"
          
          # dch updates the version AND the build timestamp automatically
          dch --newversion "$NEW_VERSION" \
              --distribution "${{ matrix.debian_version }}" \
              --force-distribution \
              --force-bad-version \
              "Automated build for version $ORIG_VERSION by RBS."

          # Apply your custom rules
          cp ../rules-rbs debian/rules
          chmod +x debian/rules

      - name: Run dpkg-buildpackage
        run: |
          cd nginx-*/
          # Build binary package only
          dpkg-buildpackage -rfakeroot -uc -b -j$(nproc)

      - name: Upload .deb Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nginx-binaries-${{ matrix.debian_version }}
          path: ./*.deb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "manual-build-${{ matrix.debian_version }}-${{ github.run_id }}"
          files: ./*.deb
          name: "Nginx ${{ matrix.debian_version }} Build"
          body: "Custom Nginx build for ${{ matrix.debian_version }}. Compiled on $(date)."
