worker_processes auto;
worker_shutdown_timeout 30;
worker_rlimit_nofile 200000;
pid /var/run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;
error_log /dev/stderr warn;

events {
    worker_connections 4000;
    multi_accept on;
    use epoll;
}

http {
    aio threads;
    directio 4m;

    # Basic Settings:
    sendfile on;
    sendfile_max_chunk 512k;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 60 60;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 5;
    client_header_timeout 5;
    send_timeout 10;
    types_hash_max_size 2048;
    server_tokens off;
    fastcgi_ignore_client_abort on;
    fastcgi_read_timeout 300;
    server_names_hash_max_size 8192;
    server_names_hash_bucket_size 128;
    charset UTF-8;
    ssi on;
    ssi_value_length 1024;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
  
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$host" sn="$server_name" '
                    'ct=$connection_time '
                    'rt=$request_time '
                    'ua="$upstream_addr" us="$upstream_status" '
                    'ut="$upstream_response_time" ul="$upstream_response_length" '
                    'cs="$upstream_cache_status" h3="$http3"';


    access_log /dev/stdout main;

    # Gzip Settings:
    gzip on;
    gzip_static on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
    application/atom+xml application/javascript application/json application/ld+json application/manifest+json
    application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/x-font-ttf
    application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype
    image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard
    text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

    # Brotli Settings:
    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types
    application/atom+xml application/javascript application/json application/vnd.api+json application/rss+xml
    application/vnd.ms-fontobject application/x-font-opentype application/x-font-truetype
    application/x-font-ttf application/x-javascript application/xhtml+xml application/xml
    font/eot font/opentype font/otf font/truetype image/svg+xml image/vnd.microsoft.icon
    image/x-icon image/x-win-bitmap text/css text/javascript text/plain text/xml;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
